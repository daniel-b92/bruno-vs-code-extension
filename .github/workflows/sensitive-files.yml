name: Sensitive files

# Flags pull requests that change files from which code can be executed automatically on a developer machine
# (e.g. on `npm install`, when running npm scripts or when opening the repo in VS Code or Claude Code). Such changes
# need a particularly careful review before merging.
#
# `pull_request_target` is used so that the workflow definition from the base branch is used. With `pull_request`,
# a pull request could simply change or remove this check. This is safe, since the workflow never checks out or
# executes code from the pull request. It only reads the list of changed files via the GitHub API.
on:
    pull_request_target: # zizmor: ignore[dangerous-triggers]
        types: [opened, synchronize, reopened]

permissions: {}

jobs:
    check-sensitive-files:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read

        steps:
            - name: Check for changes to sensitive files
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
                  PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
                  # Extended regular expressions for the paths of sensitive files.
                  SENSITIVE_FILE_PATTERNS: |
                      (^|/)package(-lock)?\.json$
                      (^|/)\.npmrc$
                      (^|/)\.lockfile-lintrc
                      (^|/)\.prettierrc
                      (^|/)[^/]*\.config\.[cm]?[jt]s$
                      (^|/)tsconfig[^/]*\.json$
                      (^|/)(CLAUDE|AGENTS)\.md$
                      (^|/)\.mcp\.json$
                      ^\.claude/
                      ^\.vscode/
                      ^\.devcontainer/
                      ^\.husky/
                      ^\.github/
                      ^\.gitmodules$
                  # Files that Dependabot changes for dependency updates, which are checked by the CI workflow instead.
                  DEPENDABOT_FILE_PATTERNS: |
                      (^|/)package(-lock)?\.json$
                      ^\.github/workflows/
              run: |
                  # Renamed files are included with their old and their new path.
                  changed_files=$(gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST_NUMBER/files" --paginate \
                      --jq '.[] | .filename, (.previous_filename // empty)' | sort -u)

                  sensitive_files=$(grep -E -f <(printf '%s' "$SENSITIVE_FILE_PATTERNS") <<< "$changed_files" || true)

                  if [ "$PULL_REQUEST_AUTHOR" = "dependabot[bot]" ]; then
                      sensitive_files=$(grep -v -E -f <(printf '%s' "$DEPENDABOT_FILE_PATTERNS") <<< "$sensitive_files" || true)
                  fi

                  if [ -z "$sensitive_files" ]; then
                      echo "No sensitive files changed."
                      exit 0
                  fi

                  {
                      echo "### Sensitive files changed"
                      echo
                      echo "Code from these files can run automatically on developer machines. Review them carefully before merging. This check is expected to fail for such changes and does not block merging, see CONTRIBUTING.md."
                      echo
                      sed 's/^/- `/; s/$/`/' <<< "$sensitive_files"
                  } >> "$GITHUB_STEP_SUMMARY"

                  while IFS= read -r file; do
                      echo "::error title=Sensitive file changed::$file"
                  done <<< "$sensitive_files"

                  exit 1
