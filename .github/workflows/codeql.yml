name: CodeQL

# Static analysis of the TypeScript code (e.g. command injection, path traversal, ReDoS) and of the GitHub Actions workflows.
# Results are shown in the "Security" tab of the repository. The scheduled run also picks up new queries and
# detection rules for code that has not changed.
on:
    push:
        branches:
            - main
    pull_request:
    schedule:
        - cron: "17 4 * * 1"

permissions: {}

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language:
                    - javascript-typescript
                    - actions

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  queries: security-extended

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  category: "/language:${{ matrix.language }}"
