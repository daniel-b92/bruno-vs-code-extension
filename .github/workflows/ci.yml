name: CI

on:
    push:
        branches:
            - "**"
    pull_request:

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint

            - name: Build extension
              run: npm run compile

            - name: Run tests
              run: npm run test-server
