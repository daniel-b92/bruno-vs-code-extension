name: CI

on:
    push:
        branches:
            - "**"

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint

            - name: Build extension
              run: npm run compile

            - name: Run tests
              run: npm run test-all
