name: CI

on:
    push:
        branches:
            - "**"
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

permissions:
    contents: read

jobs:
    build-and-test:
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint

            - name: Build extension
              run: npm run compile

            - name: Run tests
              run: npm run test-server
