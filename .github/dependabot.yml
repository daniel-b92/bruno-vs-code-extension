# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    - package-ecosystem: "npm" # See documentation for possible values
      directories:
          - "**/*"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7
      ignore:
          # Typescript 7 is the native compiler and no longer ships the JS compiler API (`typescript/lib/tsserverlibrary`)
          # that the `tsPlugin` (and its tests) are built on. Only 7.0.x is ignored, so that the pull request for 7.1.0
          # (which is expected to bring a stable API) serves as a reminder to check the migration of the plugin.
          # It is not meant to be merged as it is, see the tracking issue for the migration.
          - dependency-name: "typescript"
            versions: [">=7.0.0 <7.1.0"]

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7
